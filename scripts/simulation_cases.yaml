simulation_settings:
  model_name: MeshedReservoir.Examples.ThreeLoops
  startTime: 0
  stopTime: 216000
  solver: Radau
  tolerance: 1.0e-6

cases:
  # Case 1: high pressure
  - label: "high pressure"
    parameters:
      conInd: 1  # highPressure
      loo1:
        addHeat: false
      loo2:
        addHeat: false
      loo3:
        addHeat: false

  # Case 2: ideal pressure
  - label: "ideal pressure"
    parameters:
      conInd: 2  # idealPressure
      use_wasteHeat: false
      loo1:
        addHeat: false
      loo2:
        addHeat: false
      loo3:
        addHeat: false


  # Case 3: low pressure
  - label: "low pressure"
    parameters:
      conInd: 3  # lowPressure
      use_wasteHeat: false
      loo1:
        addHeat: false
      loo2:
        addHeat: false
      loo3:
        addHeat: false

  # Case 4: ideal, on, with heat settings
  - label: "ideal, on, with heat"
    parameters:
      conInd: 2  # idealPressure
      use_wasteHeat: false
      loo1:
        addHeat: false
      loo2:
        addHeat: true
      loo3:
        addHeat: false

  # Case 5: ideal, on, with heat settings
  - label: "ideal, with interloop heat transfer"
    parameters:
      conInd: 2  # idealPressure
      use_wasteHeat: true
      loo1:
        addHeat: false
      loo2:
        addHeat: false
      loo3:
        addHeat: false
