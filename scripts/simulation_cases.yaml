simulation_settings:
  model_name: MeshedReservoir.Examples.ThreeLoops
  startTime: 0
  stopTime: 10800
  solver: CVode
  tolerance: 1.0e-6

cases:
  # Case 1: pumSchRam with high settings
  - pumSch: pumSchRam
    label: "high ramp"
    parameters:
      loo1:
        have_pumpUpstream: true
        have_expansionVesselUpstream: true
        addHeat: false
      loo2:
        have_pumpUpstream: true
        have_expansionVesselUpstream: true
        addHeat: false
      loo3:
        have_pumpUpstream: true
        have_expansionVesselUpstream: true
        addHeat: false

  # Case 2: pumSchRam with ideal settings
  - pumSch: pumSchRam
    label: "ideal ramp"
    parameters:
      loo1:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false
      loo2:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false
      loo3:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false

  # Case 3: pumSchRam with low settings
  - pumSch: pumSchRam
    label: "low ramp"
    parameters:
      loo1:
        have_pumpUpstream: false
        have_expansionVesselUpstream: false
        addHeat: false
      loo2:
        have_pumpUpstream: false
        have_expansionVesselUpstream: false
        addHeat: false
      loo3:
        have_pumpUpstream: false
        have_expansionVesselUpstream: false
        addHeat: false

  # Case 4: pumSchDip with high settings
  - pumSch: pumSchDip
    label: "high trapezoid"
    parameters:
      loo1:
        have_pumpUpstream: true
        have_expansionVesselUpstream: true
        addHeat: false
      loo2:
        have_pumpUpstream: true
        have_expansionVesselUpstream: true
        addHeat: false
      loo3:
        have_pumpUpstream: true
        have_expansionVesselUpstream: true
        addHeat: false

  # Case 5: pumSchDip with ideal settings
  - pumSch: pumSchDip
    label: "ideal trapezoid"
    parameters:
      loo1:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false
      loo2:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false
      loo3:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false

  # Case 6: pumSchDip with low settings
  - pumSch: pumSchDip
    label: "low trapezoid"
    parameters:
      loo1:
        have_pumpUpstream: false
        have_expansionVesselUpstream: false
        addHeat: false
      loo2:
        have_pumpUpstream: false
        have_expansionVesselUpstream: false
        addHeat: false
      loo3:
        have_pumpUpstream: false
        have_expansionVesselUpstream: false
        addHeat: false

  # Case 7: pumSchOn with ideal settings
  - pumSch: pumSchOn
    label: "ideal, on, with heat"
    parameters:
      loo1:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false
      loo2:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false
      loo3:
        have_pumpUpstream: false
        have_expansionVesselUpstream: true
        addHeat: false